spring.application.name=hy-server
server.port=8080

# ========== 数据源（请按你的 Docker MySQL 实际参数调整）==========
spring.datasource.url=jdbc:mysql://localhost:3306/hy_server?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA ==========
# 表已在 Docker 中手动创建，不让 Hibernate 改动表结构
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# 不启用 schema 初始化（表已存在）
spring.sql.init.mode=never
